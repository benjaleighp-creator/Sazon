# ============================================================
# Sazón — especificación de XcodeGen.
# El proyecto de Xcode (.xcodeproj) no se sube al repositorio: lo
# genera GitHub Actions con `xcodegen generate`.
# La app y una extensión de widgets (calorías, agua, ayuno y la
# Actividad en vivo). Comparten datos por el App Group
# group.pe.benjamin.sazon. Los permisos se agregan al pseudo-firmar en
# GitHub Actions (Configuracion/*.entitlements).
# ============================================================
name: Sazon

options:
  bundleIdPrefix: pe.benjamin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  Sazon:
    type: application
    platform: iOS
    sources:
      - path: Sazon
      - path: Compartido
    dependencies:
      - target: SazonWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Sazon
        PRODUCT_BUNDLE_IDENTIFIER: pe.benjamin.sazon
        INFOPLIST_FILE: Configuracion/Sazon-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"

  SazonWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SazonWidget
      - path: Compartido
    settings:
      base:
        PRODUCT_NAME: SazonWidget
        PRODUCT_BUNDLE_IDENTIFIER: pe.benjamin.sazon.widget
        INFOPLIST_FILE: Configuracion/SazonWidget-Info.plist
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  # Pruebas automáticas de la lógica (sin interfaz). Compila directamente
  # los archivos de lógica pura, así no necesita abrir la app.
  SazonPruebas:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Pruebas
      - path: Sazon/Modelo/Modelos.swift
      - path: Sazon/Modelo/ModelosExtra.swift
      - path: Sazon/Logica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.benjamin.sazon.pruebas
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Pruebas:
    build:
      targets:
        SazonPruebas: [test]
    test:
      config: Debug
      targets:
        - SazonPruebas
  Sazon:
    build:
      targets:
        Sazon: all
    run:
      config: Debug
    archive:
      config: Release
